<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário — Entrevista RBCIP</title>
  <link rel="stylesheet" href="css/styles.css?v=20260825f" />
</head>
<body>
  <header class="brand-bar">
    <img class="brand-bar__logo" src="assets/logo-rbcip.png" alt="RBCIP — pesquisa e inovação"
         onerror="this.style.display='none';this.parentNode.querySelector('.brand-bar__texto').style.display='inline-flex';" />
    <span class="brand-bar__texto">RBCIP <small>pesquisa e inovação</small></span>
  </header>
  <main class="container" id="app"></main>

  <!-- SDK do Supabase (carregado do CDN). Se não configurado, o formulário
       funciona em modo de teste salvando no navegador. -->

  <script src="js/config.js?v=20260825f"></script>
  <script src="js/forms-schema.js?v=20260825f"></script>
  <script src="js/app.js?v=20260825f"></script>
</body>
</html>
