<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Entrevistas RBCIP</title>
  <link rel="stylesheet" href="css/styles.css?v=20260827e" />
  <link rel="stylesheet" href="css/dashboard.css?v=20260827e" />
</head>
<body>
  <header class="brand-bar">
    <img class="brand-bar__logo" src="assets/logo-rbcip.png" alt="RBCIP — pesquisa e inovação"
         onerror="this.style.display='none';this.parentNode.querySelector('.brand-bar__texto').style.display='inline-flex';" />
    <span class="brand-bar__texto">RBCIP <small>pesquisa e inovação</small></span>
  </header>

  <!-- ---------- Tela de login ---------- -->
  <main class="login oculto" id="login">
    <form class="login__card" id="login-form">
      <p class="home__marca">Processo Seletivo RBCIP</p>
      <h1 class="login__titulo">Dashboard de Entrevistas</h1>
      <p class="login__sub">Acesso restrito. Entre com suas credenciais.</p>

      <label class="login__label" for="email">E-mail</label>
      <input class="login__input" type="email" id="email" autocomplete="username" required />

      <label class="login__label" for="senha">Senha</label>
      <input class="login__input" type="password" id="senha" autocomplete="current-password" required />

      <div class="banner banner--erro oculto" id="login-erro"></div>

      <button class="btn login__btn" type="submit" id="login-btn">Entrar</button>
      <a class="login__voltar" href="index.html">← Voltar para os formulários</a>
    </form>
  </main>

  <!-- ---------- Dashboard ---------- -->
  <main class="dash oculto" id="dashboard">
    <header class="dash__topo">
      <div class="dash__ident">
        <h1 class="dash__titulo">Dashboard de Entrevistas</h1>
        <p class="dash__sub">Processo Seletivo RBCIP</p>
      </div>
      <div class="dash__usuario">
        <span class="dash__versao" id="app-versao" title="Versão carregada no navegador"></span>
        <span id="usuario-email"></span>
        <button class="btn btn--secundario btn--pequeno" id="btn-largura" type="button" title="Alternar entre largura padrão e tela cheia">⛶ Tela cheia</button>
        <button class="btn btn--secundario btn--pequeno" id="btn-atualizar" type="button">Atualizar</button>
      </div>
      <!-- Último do cabeçalho: no desktop cai à direita de "Atualizar". No
           celular o CSS reordena para ele ficar na linha do título. -->
      <button class="menu-btn" id="btn-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-lateral">
        <span class="menu-btn__barras" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="abas" id="abas">
      <button class="aba aba--ativa" data-aba="candidatos" type="button">Candidatos <span class="aba__contagem" id="cont-candidatos">0</span></button>
      <button class="aba" data-aba="capital" type="button">Entrevistas Capital <span class="aba__contagem" id="cont-capital">0</span></button>
      <button class="aba" data-aba="interior" type="button">Entrevistas Interior <span class="aba__contagem" id="cont-interior">0</span></button>
      <button class="aba" data-aba="formacao" type="button">Formação <span class="aba__contagem" id="cont-formacao">0</span></button>
      <button class="aba" data-aba="dados" type="button">Visualização de dados</button>
    </nav>

    <div class="banner banner--erro oculto" id="dash-erro"></div>
    <div class="dash__carregando" id="carregando">Carregando entrevistas…</div>

    <section class="painel" id="painel-candidatos"></section>
    <section class="painel oculto" id="painel-capital"></section>
    <section class="painel oculto" id="painel-interior"></section>
    <section class="painel oculto" id="painel-formacao"></section>
    <section class="painel oculto" id="painel-dados"></section>

    <!-- Páginas do menu lateral (Gerenciar usuários, Meu perfil). Não são
         abas: ocupam a tela inteira e voltam pelo botão "← Voltar". -->
    <section class="pagina oculto" id="pagina"></section>
  </main>

  <!-- ---------- Menu lateral ---------- -->
  <div class="menu-fundo oculto" id="menu-fundo"></div>
  <nav class="menu-lat oculto" id="menu-lateral" aria-label="Menu principal">
    <div class="menu-lat__topo">
      <span class="menu-lat__rotulo">Menu</span>
      <button class="menu-lat__fechar" id="menu-fechar" type="button" aria-label="Fechar menu">×</button>
    </div>
    <div class="menu-lat__quem">
      <span class="menu-lat__email" id="menu-email"></span>
      <span class="selo-perfil" id="menu-perfil"></span>
    </div>
    <ul class="menu-lat__lista">
      <li><a class="menu-lat__item" href="index.html"><span class="menu-lat__ico" aria-hidden="true">📄</span>Formulários</a></li>
      <li id="menu-li-usuarios"><button class="menu-lat__item" type="button" data-pagina="usuarios"><span class="menu-lat__ico" aria-hidden="true">👥</span>Gerenciar usuários</button></li>
      <li><button class="menu-lat__item" type="button" data-pagina="perfil"><span class="menu-lat__ico" aria-hidden="true">👤</span>Meu perfil</button></li>
    </ul>
    <div class="menu-lat__rodape">
      <button class="btn btn--secundario menu-lat__sair" id="btn-sair" type="button">Sair</button>
    </div>
  </nav>

  <!-- ---------- Modal de detalhes ---------- -->
  <div class="modal oculto" id="modal">
    <div class="modal__fundo" id="modal-fundo"></div>
    <div class="modal__caixa" role="dialog" aria-modal="true">
      <button class="modal__fechar" id="modal-fechar" type="button" aria-label="Fechar">×</button>
      <div id="modal-conteudo"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260827e"></script>
  <script src="js/forms-schema.js?v=20260827e"></script>
  <script src="js/export.js?v=20260827e"></script>
  <script src="js/dashboard.js?v=20260827e"></script>
</body>
</html>
